inherit_from: .rubocop_todo.yml
inherit_mode:
  merge:
    - Exclude

plugins:  
  - rubocop-minitest
  - rubocop-rake
  - rubocop-performance
AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
    Max: 20

Metrics/AbcSize:
    Max: 40

Minitest/MultipleAssertions:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Metrics/ClassLength:
  Exclude:
    - 'test/**/*' # Allow longer test classes
