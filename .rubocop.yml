plugins:  
  - rubocop-minitest
  - rubocop-rake
  - rubocop-performance
AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
    Max: 20

Metrics/AbcSize:
    Max: 40

Minitest/MultipleAssertions:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Metrics/ClassLength:
  Exclude:
    - 'test/**/*' # Allow longer test classes


# Keyword arguments name the element members they set.
Metrics/ParameterLists:
  CountKeywordArgs: false
